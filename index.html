
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMAR APP 3.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:25px 18px;
 background:#070b16;color:white;
 font-family:Arial;text-align:center
}
.container{max-width:450px;margin:auto}
h1{color:#38a5ff;letter-spacing:3px}
.card{
 background:#111b2e;padding:25px;
 border:1px solid #23446b;
 border-radius:22px;margin-top:20px
}
#clock{font-size:43px;font-weight:bold;margin:15px 0}
#date{color:#a9b8ca}
#weather{font-size:27px;margin:15px}
.small{color:#9fb3cc}
</style>
</head>
<body>
<div class="container">
<h1>⚡ UMAR APP 3.0</h1>

<div class="card">
<h2 id="greeting">Привет!</h2>
<input id="userName" placeholder="Введи своё имя" maxlength="30">
<button onclick="saveUserName()">Сохранить имя</button>
<p class="small">Твой личный помощник</p>
<div id="clock">00:00:00</div>
<div id="date"></div>
</div>

<div class="card">
<h2>🌤 Погода в Зомине</h2>
<div id="weather">Загрузка...</div>
<div id="details"></div>
</div>
</div>

<script>
function updateClock(){
 const n=new Date();
 document.getElementById("clock").textContent=
 n.toLocaleTimeString("ru-RU");
 document.getElementById("date").textContent=
 n.toLocaleDateString("ru-RU",{
 weekday:"long",day:"numeric",
 month:"long",year:"numeric"
 });
}
setInterval(updateClock,1000);
updateClock();

function speak(text){
 if(!("speechSynthesis" in window)) return;
 speechSynthesis.cancel();
 const msg=new SpeechSynthesisUtterance(text);
 msg.lang="ru-RU";
 msg.rate=0.9;
 msg.pitch=1;
 const voices=speechSynthesis.getVoices();
 const voice=voices.find(v=>v.lang.toLowerCase().startsWith("ru"));
 if(voice) msg.voice=voice;
 speechSynthesis.speak(msg);
}

async function getWeather(){
 try{
 const url="https://api.open-meteo.com/v1/forecast?latitude=39.7000&longitude=68.4000&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=Asia%2FTashkent";
 const r=await fetch(url);
 const d=await r.json();
 const c=d.current;
 const names={
 0:"Ясно",1:"Преимущественно ясно",
 2:"Переменная облачность",3:"Облачно",
 45:"Туман",48:"Туман",
 51:"Морось",61:"Дождь",63:"Дождь",
 65:"Сильный дождь",71:"Снег",
 80:"Ливень",95:"Гроза"
 };
 const condition=names[c.weather_code]||"Погодные условия";
 document.getElementById("weather").textContent=
 condition+" · "+c.temperature_2m+"°C";
 document.getElementById("details").textContent=
 "Влажность: "+c.relative_humidity_2m+
 "% | Ветер: "+c.wind_speed_10m+" км/ч";

 window.weatherMessage=
 "Сейчас в Зомине "+condition+
 ". Температура "+c.temperature_2m+
 " градусов. Влажность "+
 c.relative_humidity_2m+" процентов.";
 }catch(e){
 document.getElementById("weather").textContent=
 "Нет подключения к интернету";
 }
}

async function startApp(){
 await getWeather();
 const n=new Date();
 const time=n.toLocaleTimeString("ru-RU",{
 hour:"2-digit",minute:"2-digit"
 });
 const message="Привет, Умар! Добро пожаловать. "+
 "Сейчас "+time+". "+(window.weatherMessage||"");
 speak(message);
}

window.addEventListener("load",()=>{
 setTimeout(startApp,1200);
});
</script>


<style>
#umar3d{margin:18px 10px;padding:16px;border:1px solid #087eaa;border-radius:22px;background:radial-gradient(circle at 50% 40%,#10264a,#030711 75%);color:white;text-align:center;overflow:hidden;box-shadow:0 0 25px #008cff33}
#umar3d h2{color:#42eaff;text-shadow:0 0 12px #00bfff}
#u3dview{height:330px;width:100%;touch-action:none}
#u3dview canvas{width:100%;height:100%;display:block}
.u3dbtn{background:#102b48;color:#61edff;border:1px solid #00bfff;border-radius:12px;padding:11px 13px;margin:4px;font-weight:bold}
#u3dstatus{font-size:12px;color:#9ddcff;margin:12px}
</style>
<section id="umar3d">
<h2>UMAR 3D UNIVERSE</h2>
<div>
<button class="u3dbtn" onclick="u3dShow('skull')">CYBER SKULL</button>
<button class="u3dbtn" onclick="u3dShow('globe')">GLOBE</button>
<button class="u3dbtn" onclick="u3dShow('robot')">ROBOT</button>
</div>
<div id="u3dview"></div>
<div id="u3dstatus">3D yuklanmoqda...</div>
<button class="u3dbtn" onclick="u3dGyro()">GYROSCOPE ON</button>
<p style="font-size:12px;color:#a7c5e8">Barmoq bilan aylantiring yoki telefonni qimirlatib ko‘ring</p>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const view=document.getElementById('u3dview');
const status=document.getElementById('u3dstatus');
if(!window.THREE){status.textContent='3D yuklanmadi. Internetni tekshiring.';return}
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030711);
const camera=new THREE.PerspectiveCamera(42,1,.1,100);
camera.position.set(0,0,6);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
view.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x8bbcff,1.3));
const light=new THREE.PointLight(0x00cfff,3,20);
light.position.set(3,4,5);scene.add(light);
const blue=new THREE.MeshStandardMaterial({color:0x168edb,metalness:.65,roughness:.25});
const cyan=new THREE.MeshStandardMaterial({color:0x20eaff,metalness:.6,roughness:.2,emissive:0x003344});
const dark=new THREE.MeshStandardMaterial({color:0x101c35,metalness:.8,roughness:.3});
const white=new THREE.MeshStandardMaterial({color:0xc9eaff,metalness:.55,roughness:.25});
const groups={};
function addMesh(g,geo,mat,x,y,z,sx=1,sy=1,sz=1){
const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);g.add(m);return m;
}
function sphere(g,mat,x,y,z,sx,sy,sz){return addMesh(g,new THREE.SphereGeometry(1,32,24),mat,x,y,z,sx,sy,sz)}
function box(g,mat,x,y,z,sx,sy,sz){return addMesh(g,new THREE.BoxGeometry(sx,sy,sz),mat,x,y,z)}
function makeSkull(){
const g=new THREE.Group();
sphere(g,white,0,.35,0,.9,1.05,.72);
box(g,white,0,-.65,.02,1.15,.45,.65);
for(const x of [-.38,.38]){
sphere(g,dark,x,.25,.62,.25,.3,.13);
sphere(g,cyan,x,.25,.73,.09,.09,.05);
}
box(g,dark,0,-.2,.68,.2,.3,.12);
for(let x=-.4;x<=.4;x+=.2)box(g,white,x,-.68,.37,.12,.22,.12);
for(const x of [-1,1]){
const ear=sphere(g,cyan,x*.87,.1,0,.13,.22,.13);
}
return g;
}
function makeGlobe(){
const g=new THREE.Group();
sphere(g,blue,0,0,0,1.35,1.35,1.35);
const gridmat=new THREE.MeshBasicMaterial({color:0x56eaff,transparent:true,opacity:.35,wireframe:true});
g.add(new THREE.Mesh(new THREE.SphereGeometry(1.37,18,14),gridmat));
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.58,.018,8,100),cyan);
ring.rotation.x=1.05;ring.rotation.y=.35;g.add(ring);
const ring2=new THREE.Mesh(new THREE.TorusGeometry(1.48,.012,8,100),cyan);
ring2.rotation.x=.35;ring2.rotation.y=1.1;g.add(ring2);
return g;
}
function makeRobot(){
const g=new THREE.Group();
box(g,dark,0,0,0,1.9,2,.95);
box(g,white,0,.1,.52,1.65,1.25,.22);
box(g,dark,0,-.1,.66,1.35,.65,.12);
for(const x of [-.42,.42]){
sphere(g,cyan,x,.05,.78,.2,.2,.1);
sphere(g,white,x,.05,.86,.07,.07,.04);
}
box(g,cyan,0,-.58,.7,.55,.08,.08);
for(const x of [-1.05,1.05])box(g,blue,x,0,0,.2,.65,.5);
box(g,cyan,0,1.15,0,.12,.35,.12);
sphere(g,cyan,0,1.38,0,.16,.16,.16);
return g;
}
groups.skull=makeSkull();groups.globe=makeGlobe();groups.robot=makeRobot();
Object.values(groups).forEach(g=>{scene.add(g);g.visible=false});
let current='skull';groups[current].visible=true;
window.u3dShow=(name)=>{
Object.values(groups).forEach(g=>g.visible=false);
current=name;groups[name].visible=true;
status.textContent=name.toUpperCase()+' — tayyor';
};
let down=false,px=0,py=0,rx=0,ry=0;
view.addEventListener('pointerdown',e=>{down=true;px=e.clientX;py=e.clientY;view.setPointerCapture(e.pointerId)});
view.addEventListener('pointermove',e=>{
if(!down)return;
ry+=(e.clientX-px)*.009;rx+=(e.clientY-py)*.009;
px=e.clientX;py=e.clientY;
});
view.addEventListener('pointerup',()=>down=false);
view.addEventListener('pointercancel',()=>down=false);
let gyroOn=false;
window.u3dGyro=async()=>{
try{
if(typeof DeviceOrientationEvent==='undefined'){status.textContent='Giroskop sensori topilmadi';return}
if(typeof DeviceOrientationEvent.requestPermission==='function'){
const permission=await DeviceOrientationEvent.requestPermission();
if(permission!=='granted'){status.textContent='Giroskop ruxsati berilmadi';return}
}
window.addEventListener('deviceorientation',e=>{
if(!gyroOn||e.beta===null||e.gamma===null)return;
rx=THREE.MathUtils.degToRad(e.beta);
ry=THREE.MathUtils.degToRad(e.gamma);
});
gyroOn=true;status.textContent='GYROSCOPE ISHLAYAPTI';
}catch(e){status.textContent='Giroskopni yoqib bo‘lmadi: '+e.message}
};
function resize(){
const w=view.clientWidth,h=view.clientHeight;
if(!w||!h)return;
renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);resize();
function animate(){
requestAnimationFrame(animate);
const g=groups[current];
if(!down&&!gyroOn)ry+=.003;
g.rotation.x=THREE.MathUtils.lerp(g.rotation.x,rx,.12);
g.rotation.y=THREE.MathUtils.lerp(g.rotation.y,ry,.12);
renderer.render(scene,camera);
}
animate();
status.textContent='3D tayyor — obyektni barmoq bilan aylantiring';
})();
</script>
